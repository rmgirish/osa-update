services:
  postgres:
    image: postgres:16-alpine
    container_name: open_source_assist_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_source_assist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-open_source_assist}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: open_source_assist_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local
  postgres_data:

